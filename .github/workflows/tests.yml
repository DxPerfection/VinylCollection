name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y libzbar0
      - run: pip install -r requirements.txt pytest pyflakes
      - name: Check for mistakes such as misspelled names
        run: python -m pyflakes vinylApp.py vinyl tests
      - run: python -m pytest -q tests
